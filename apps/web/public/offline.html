<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeeef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
    <title>Orb Meet — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: light-dark(#eeeef1, #08080b); color: light-dark(#121216, #f2f1f7); }
      main { width: min(30rem, calc(100vw - 3rem)); text-align: center; }
      h1 { margin: 0; font-size: 1.75rem; }
      p { margin: .75rem 0 1.5rem; color: light-dark(#45454f, #c4c2d0); line-height: 1.6; }
      a { display: inline-block; border-radius: .75rem; background: #5838ee; color: white; padding: .75rem 1.1rem; font-weight: 650; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Orb Meet needs an internet connection for meetings and live collaboration. Reconnect, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
