<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeeef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>Open in your browser · OrbMeet</title>
    <!--
      Where another app's built-in browser is sent (src/app/shell/in-app-browser.ts).
      Colours are custom properties under a media query rather than light-dark(),
      which an Android System WebView older than Chrome 123 drops whole.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #eeeef1; --card: #fff; --ink: #121216; --muted: #64646f; --accent: #5838ee; --line: #d6d6de; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #08080b; --card: #121217; --ink: #f2f1f7; --muted: #9a98a8; --accent: #6a4cff; --line: #2c2c36; }
      }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.5 Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: 100%; max-width: 360px; box-sizing: border-box; padding: 28px 24px; border-radius: 16px; background: var(--card); text-align: center; }
      .orb { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #beb0ff, #6a4cff 60%, #3720a8); }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
      .button { display: block; width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 10px; font: inherit; font-weight: 600; line-height: 1.25; text-decoration: none; cursor: pointer; }
      .primary { margin-bottom: 10px; border: 0; background: var(--accent); color: #fff; }
      .secondary { border: 1px solid var(--line); background: transparent; color: var(--ink); }
      .hint { margin: 16px 0 0; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>Open OrbMeet in your browser</h1>
      <p>This app’s built-in browser can’t use your camera and microphone, so meetings don’t work here.</p>
      <a class="button primary" id="open" hidden></a>
      <button class="button secondary" id="copy" type="button">Copy link</button>
      <p class="hint" id="hint">Copy the link and paste it into Chrome, Safari, Edge or Firefox.</p>
    </main>
    <script src="/open-in-browser.js"></script>
  </body>
</html>
