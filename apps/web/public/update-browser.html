<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeeef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>Update your browser · OrbMeet</title>
    <!--
      Where a browser too old for the app is sent (src/app/shell/browser-support.ts).
      It is that browser that reads this page, so its colours are custom
      properties under a media query rather than light-dark(), and it runs no script.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #eeeef1; --card: #fff; --ink: #121216; --muted: #64646f; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #08080b; --card: #121217; --ink: #f2f1f7; --muted: #9a98a8; }
      }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.5 Geist, ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: 100%; max-width: 360px; box-sizing: border-box; padding: 28px 24px; border-radius: 16px; background: var(--card); text-align: center; }
      .orb { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #beb0ff, #6a4cff 60%, #3720a8); }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
      p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
      p:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>Update your browser to use OrbMeet</h1>
      <p>This browser is missing features OrbMeet needs. Update it, or open OrbMeet in a current version of Chrome, Edge, Firefox or Safari.</p>
      <p>On an iPhone or iPad, Safari updates with iOS: open Settings, then General, then Software Update.</p>
    </main>
  </body>
</html>
