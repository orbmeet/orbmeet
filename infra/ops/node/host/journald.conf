# Every container logs to the journal (Docker's journald driver), where a log
# outlives the container that wrote it and orbmeet-ship-logs reads it.
[Journal]
Storage=persistent
SystemMaxUse=4G
# Every container's output arrives through dockerd, one service as far as the
# journal can tell: a per-service rate limit would drop lines from all of
# them during a busy meeting. SystemMaxUse bounds what a flood can cost.
RateLimitIntervalSec=0
